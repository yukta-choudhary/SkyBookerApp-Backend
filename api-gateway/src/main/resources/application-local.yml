# Local dev profile: routes directly to localhost ports without needing Eureka.
# Run gateway with: --spring.profiles.active=local

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    discovery:
      enabled: false

    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true

      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: airline-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/airlines/**

        - id: airport-routes-via-airline-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/airports/**

        - id: flight-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/flights/**

        - id: booking-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/bookings/**

        - id: passenger-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/passengers/**

        - id: seat-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/seats/**

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"