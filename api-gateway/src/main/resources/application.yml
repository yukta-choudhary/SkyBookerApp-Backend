server:
  port: 8080

spring:
  application:
    name: api-gateway

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      # IMPORTANT: fixes browser preflight (OPTIONS) issues through the gateway
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - "Authorization"
            allowCredentials: true

      # Global filter: deduplicate CORS headers that downstream services may also set
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_FIRST

      routes:
        - id: auth-oauth2
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/oauth2/**

        - id: auth-login-oauth2
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/login/oauth2/**

        - id: auth-service
          uri: ${AUTH_SERVICE_URI:lb://auth-service}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@ipKeyResolver}"

        - id: airline-service
          uri: ${AIRLINE_SERVICE_URI:lb://airline-service}
          predicates:
            - Path=/api/v1/airlines/**

        - id: airport-routes-via-airline-service
          uri: ${AIRLINE_SERVICE_URI:lb://airline-service}
          predicates:
            - Path=/api/v1/airports/**

        - id: flight-service
          uri: ${FLIGHT_SERVICE_URI:lb://flight-service}
          predicates:
            - Path=/api/v1/flights/**

        - id: booking-service
          uri: ${BOOKING_SERVICE_URI:lb://booking-service}
          predicates:
            - Path=/api/v1/bookings/**

        - id: passenger-service
          uri: ${PASSENGER_SERVICE_URI:lb://passenger-service}
          predicates:
            - Path=/api/v1/passengers/**

        - id: seat-service
          uri: ${SEAT_SERVICE_URI:lb://seat-service}
          predicates:
            - Path=/api/v1/seats/**

        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:lb://payment-service}
          predicates:
            - Path=/api/v1/payments/**

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URI:lb://notification-service}
          predicates:
            - Path=/api/v1/notifications/**

# If Eureka is not running, lb:// routing will fail (gateway can’t resolve instances).
# Start service-registry on 8761 OR use the 'local' profile below OR override *_SERVICE_URI env vars.
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: "*"