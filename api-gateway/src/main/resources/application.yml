server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**

            - id: airline-service
              uri: lb://airline-service
              predicates:
                - Path=/api/v1/airlines/**

            - id: airport-service
              uri: lb://airport-service
              predicates:
                - Path=/api/v1/airports/**

            - id: aircraft-service
              uri: lb://aircraft-service
              predicates:
                - Path=/api/v1/aircrafts/**

            - id: flight-service
              uri: lb://flight-service
              predicates:
                - Path=/api/v1/flights/**

            - id: passenger-service
              uri: lb://passenger-service
              predicates:
                - Path=/api/v1/passengers/**

            - id: booking-service
              uri: lb://booking-service
              predicates:
                - Path=/api/v1/bookings/**

            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/v1/payments/**

            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notifications/**


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}	

management:
  endpoints:
    web:
      exposure:
        include: "*"
